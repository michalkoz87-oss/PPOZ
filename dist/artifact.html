<title>Egzamin rzeczoznawcy ppoż.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Układ: powłoka aplikacji z szyną nawigacji po lewej (telefon: pasek na dole), treść w jednej kolumnie do 880px.
   Język wizualny: dokumentacja techniczna i oznakowanie bezpieczeństwa — tabliczki z podstawą prawną, skala punktów z progiem 21. */
:root {
  --bg: #f2f4f7; --surface: #ffffff; --surface-2: #e8ecf1; --ink: #15202b; --ink-2: #445464; --ink-3: #6d7c8b; --line: #d3dae2;
  --accent: #1d4f91; --accent-ink: #ffffff; --accent-soft: #e1eaf6;
  --ok: #17753f; --ok-soft: #dcf1e4; --bad: #b3261e; --bad-soft: #fae3e0; --warn: #8f5600; --warn-soft: #faedd3;
  --shadow: 0 1px 2px rgba(21, 32, 43, .08), 0 4px 14px rgba(21, 32, 43, .06);
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --f-head: "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px; --r-sm: 6px; --gap: 16px; --rail: 232px; --bar: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --surface: #182029; --surface-2: #222d39; --ink: #e7ecf1; --ink-2: #aab6c3; --ink-3: #8090a0; --line: #2f3c4a;
    --accent: #86b4f0; --accent-ink: #0c1622; --accent-soft: #1b3252;
    --ok: #62c48d; --ok-soft: #153525; --bad: #f08a80; --bad-soft: #45211e; --warn: #e6b55a; --warn-soft: #3b2d11;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --surface: #182029; --surface-2: #222d39; --ink: #e7ecf1; --ink-2: #aab6c3; --ink-3: #8090a0; --line: #2f3c4a;
  --accent: #86b4f0; --accent-ink: #0c1622; --accent-soft: #1b3252;
  --ok: #62c48d; --ok-soft: #153525; --bad: #f08a80; --bad-soft: #45211e; --warn: #e6b55a; --warn-soft: #3b2d11;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3); color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--f-body); -webkit-text-size-adjust: 100%; }
h1, h2, h3, h4 { font-family: var(--f-head); font-weight: 600; line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: .005em; }
h1 { font-size: 1.7rem; } h2 { font-size: 1.3rem; } h3 { font-size: 1.08rem; } h4 { font-size: .95rem; }
p { margin: 0; } a { color: var(--accent); } ul, ol { margin: 0; padding-left: 1.25em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); } .small { font-size: .875rem; } .tiny { font-size: .78rem; }
.label { font: 600 .72rem/1.2 var(--f-head); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }

/* Powłoka */
.app { min-height: 100%; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); }
.rail { position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface);
  padding: 20px 12px calc(16px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 4px; }
.brand { padding: 4px 10px 16px; }
.brand b { display: block; font: 700 1.12rem/1.15 var(--f-head); letter-spacing: .01em; }
.brand span { font-size: .8rem; color: var(--ink-3); }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; background: none; border-radius: var(--r-sm); cursor: pointer; text-align: left; color: var(--ink-2); font-weight: 500; text-decoration: none; }
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item svg { flex: none; width: 20px; height: 20px; }
.nav-item .count { margin-left: auto; font: 600 .75rem var(--f-mono); background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 1px 7px; }
.nav-sep { height: 1px; background: var(--line); margin: 8px 6px; }
.rail-foot { margin-top: auto; padding: 10px; font-size: .78rem; color: var(--ink-3); }
.main { min-width: 0; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--gap); }
.view-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; }
.view-head p { color: var(--ink-2); }
.tabbar { display: none; }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .main { padding-block: 16px calc(var(--bar) + 28px + env(safe-area-inset-bottom, 0px)); }
  .tabbar { display: flex; position: fixed; inset: auto 0 0 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
    padding: 4px max(4px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px)); }
  .tabbar .nav-item { flex: 1; flex-direction: column; gap: 2px; padding: 6px 2px; font-size: .7rem; text-align: center; min-width: 0; position: relative; }
  .tabbar .nav-item .count { position: absolute; top: 2px; left: calc(50% + 6px); margin: 0; }
  h1 { font-size: 1.45rem; }
}

/* Powierzchnie */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.flat { background: none; border-style: dashed; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grid { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.grid.tight { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-width: 0; }
.row.between { justify-content: space-between; } .row.end { justify-content: flex-end; }
.stack { display: flex; flex-direction: column; gap: 10px; min-width: 0; } .stack.tight { gap: 4px; }
.grow { flex: 1 1 0; min-width: 0; }
.divider { height: 1px; background: var(--line); border: 0; margin: 2px 0; }
.scroll-x { overflow-x: auto; max-width: 100%; }
.prose { max-width: 68ch; display: flex; flex-direction: column; gap: 10px; }
.prose li + li { margin-top: 4px; }

/* Przyciski i pola */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 8px 16px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.btn.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.btn.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); }
.btn.sm { min-height: 34px; padding: 4px 11px; font-size: .875rem; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: .85rem; font-weight: 600; color: var(--ink-2); }
.input, select.input, textarea.input { width: 100%; min-height: 42px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
textarea.input { min-height: 90px; resize: vertical; }
.check { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 8px 13px; cursor: pointer; font-weight: 500; color: var(--ink-2); min-height: 40px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* Tabliczki i znaczniki */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: .78rem; font-weight: 600; background: var(--surface-2); color: var(--ink-2); max-width: 100%; line-height: 1.3; }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.accent { background: var(--accent-soft); color: var(--accent); }
.ref { display: inline-block; font: 500 .8rem/1.35 var(--f-mono); padding: 3px 8px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 3px; background: var(--surface); color: var(--ink); overflow-wrap: anywhere; }
.banner { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--accent-soft); color: var(--ink); font-size: .92rem; }
.banner.warn { background: var(--warn-soft); } .banner.bad { background: var(--bad-soft); } .banner.ok { background: var(--ok-soft); }
.banner b { font-weight: 600; }
.quote { border-left: 3px solid var(--line); padding: 2px 0 2px 12px; color: var(--ink-2); font-size: .9rem; }

/* Postęp */
.bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .25s; }
.bar.ok > i { background: var(--ok); } .bar.warn > i { background: var(--warn); }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font: 600 1.7rem/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.stat span { font-size: .82rem; color: var(--ink-2); }
/* Skala punktów egzaminu: -40..40 z progiem 21 */
.scale { position: relative; height: 34px; }
.scale .track { position: absolute; inset: 12px 0 auto 0; height: 10px; border-radius: 999px; background: linear-gradient(90deg, var(--bad-soft) 0 76.25%, var(--ok-soft) 76.25% 100%); border: 1px solid var(--line); }
.scale .pass { position: absolute; top: 4px; bottom: 4px; left: 76.25%; width: 2px; background: var(--ok); }
.scale .mark { position: absolute; top: 7px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: var(--ink); border: 3px solid var(--surface); box-shadow: var(--shadow); }

/* Tabele */
.table { width: 100%; border-collapse: collapse; font-size: .92rem; }
.table th { text-align: left; font: 600 .72rem var(--f-head); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table tr:last-child td { border-bottom: 0; }
.table td.num, .table th.num { text-align: right; }

/* Pytanie testowe */
.q-text { font-size: 1.06rem; line-height: 1.5; }
.opt { display: flex; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--surface); cursor: pointer; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt .letter { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 600 .85rem var(--f-mono); background: var(--surface-2); color: var(--ink-2); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-pressed="true"] .letter { background: var(--accent); color: var(--accent-ink); }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); } .opt.correct .letter { background: var(--ok); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); } .opt.wrong .letter { background: var(--bad); color: var(--surface); }
.opt[disabled] { cursor: default; }

/* Fiszka */
.flash { min-height: 230px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; text-align: center; padding: 28px 20px; cursor: pointer; }
.flash .front { font: 600 1.25rem/1.35 var(--f-head); max-width: 34ch; }
.flash .back { font-size: 1.05rem; max-width: 46ch; }

/* Okno dialogowe i komunikaty */
.modal-back { position: fixed; inset: 0; z-index: 50; background: rgba(10, 16, 22, .55); display: grid; place-items: center; padding: 16px; }
.modal { width: min(560px, 100%); max-height: min(86vh, 760px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
.toasts { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(var(--bar) + 20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: .9rem; font-weight: 500; box-shadow: var(--shadow); }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); border: 1px dashed var(--line); border-radius: var(--r); }
details.fold > summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
details.fold[open] > summary { margin-bottom: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Pytania i egzamin próbny (prefiks pr-). Kolory wyłącznie z tokenów app.css. */

/* Ekrany startowe */
.pr-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 14px 10px; }
.pr-stackbar { display: flex; gap: 2px; height: 10px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
.pr-stackbar i { display: block; height: 100%; min-width: 0; }
.pr-stackbar .m { background: var(--ok); }
.pr-stackbar .l { background: var(--accent); }
.pr-key { display: inline-flex; align-items: center; gap: 6px; }
.pr-key::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); }
.pr-key.m::before { background: var(--ok); border-color: var(--ok); }
.pr-key.l::before { background: var(--accent); border-color: var(--accent); }

.pr-tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.pr-tile { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; padding: 14px; text-align: left; cursor: pointer;
  border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.pr-tile:hover:not([disabled]) { border-color: var(--accent); }
.pr-tile b.num { font: 600 1.7rem/1.1 var(--f-mono); color: var(--accent); }
.pr-tile-t { font: 600 1.02rem/1.25 var(--f-head); }
.pr-tile[disabled] { cursor: not-allowed; }
.pr-tile[disabled] b.num, .pr-tile[disabled] .pr-tile-t { color: var(--ink-3); }

.pr-block { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.pr-block-head { display: flex; align-items: center; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; }
.pr-block-head b { font-weight: 600; }
.pr-topics { display: flex; flex-wrap: wrap; gap: 6px; }
.pr-topic { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 5px 11px 5px 9px; cursor: pointer; font-size: .875rem;
  border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.pr-topic input { width: 16px; height: 16px; margin: 0; flex: none; accent-color: var(--accent); }
.pr-topic .num { color: var(--ink-3); }
.pr-topic:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.pr-topic:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.pr-topic.off { cursor: not-allowed; color: var(--ink-3); border-style: dashed; }
.pr-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; align-items: end; padding-top: 12px; border-top: 1px solid var(--line); }
.pr-filters { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.pr-flabel { font-size: .85rem; font-weight: 600; color: var(--ink-2); }
.pr-err { color: var(--bad); font-weight: 600; }
.pr-err:empty { display: none; }
.pr-unf { align-items: center; flex-wrap: wrap; }

/* Listy pytań: wyniki wyszukiwania, błędne odpowiedzi, przegląd egzaminu */
.pr-list { display: flex; flex-direction: column; min-width: 0; }
.pr-res { display: flex; flex-direction: column; gap: 4px; width: 100%; min-width: 0; padding: 10px 2px; text-align: left; cursor: pointer;
  border: 0; border-bottom: 1px solid var(--line); background: none; }
.pr-res:last-child { border-bottom: 0; }
.pr-res:hover .pr-res-q { color: var(--accent); }
.pr-res-q { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
.pr-more { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 12px; }

/* Pytanie w sesji i na egzaminie */
.pr-head { align-items: flex-end; }
.pr-title { font-size: 1.3rem; overflow-wrap: anywhere; }
.pr-q:focus, .pr-q:focus-visible { outline: none; }
.pr-count { color: var(--ink-2); font-weight: 500; margin-right: 4px; }
.pr-q .q-text, .modal .q-text { overflow-wrap: anywhere; }
.pr-opts .opt { overflow-wrap: anywhere; }
.opt.pr-static { cursor: default; }
.opt.pr-static:hover { border-color: var(--line); }
.opt.pr-static.correct:hover { border-color: var(--ok); }
.opt.pr-static.wrong:hover { border-color: var(--bad); }
.pr-tag { font: 600 .7rem/1.3 var(--f-head); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
.opt.correct .pr-tag { color: var(--ok); }
.opt.wrong .pr-tag { color: var(--bad); }
.pr-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.pr-actions .btn { flex: 1 1 190px; }
.pr-actions .btn.ghost { flex: 0 0 auto; }
.pr-expl { gap: 12px; }
textarea.pr-note { min-height: 64px; }
.pr-flag[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.pr-flag svg { width: 16px; height: 16px; }
.pr-hidden { visibility: hidden; }
@media (hover: none) { .pr-keys { display: none; } }

/* Egzamin: pasek z licznikiem, odpowiedź „bez odpowiedzi”, siatka numerów */
.pr-bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 10px 0; background: var(--bg); border-bottom: 1px solid var(--line); }
.pr-bar-t { font: 600 1.05rem/1.2 var(--f-head); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr-timer { flex: none; min-width: 5.2ch; padding: 6px 10px; text-align: center; font: 600 1.45rem/1 var(--f-mono); font-variant-numeric: tabular-nums;
  border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.pr-timer.low { color: var(--warn); border-color: var(--warn); }
.pr-timer.last { color: var(--bad); border-color: var(--bad); }
.opt.pr-none { border-style: dashed; color: var(--ink-2); }
.opt.pr-none[aria-pressed="true"] { border-style: solid; border-color: var(--ink-3); background: var(--surface-2); color: var(--ink); }
.opt.pr-none[aria-pressed="true"] .letter { background: var(--ink-3); color: var(--surface); }
.pr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 8px 6px; }
.pr-n { position: relative; height: 40px; padding: 0; cursor: pointer; font: 500 .85rem var(--f-mono); color: var(--ink-2);
  border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.pr-n.ans { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--accent); font-weight: 600; }
.pr-n.uns::after { content: "?"; position: absolute; top: -7px; right: -5px; width: 16px; height: 16px; border-radius: 50%; text-align: center;
  font: 700 .66rem/16px var(--f-mono); background: var(--warn); color: var(--surface); }
.pr-n.cur { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); color: var(--ink); }
.pr-legend { gap: 6px 16px; padding-top: 4px; }
.pr-legend span { display: inline-flex; align-items: center; gap: 7px; }
.pr-legend i.pr-n { display: inline-block; width: 18px; height: 18px; border-radius: 4px; cursor: default; }
.pr-legend i.pr-n.uns::after { top: -6px; right: -7px; width: 13px; height: 13px; font-size: .56rem; line-height: 13px; }

/* Ekran startowy egzaminu */
.pr-rules { display: flex; flex-direction: column; gap: 6px; max-width: 68ch; }
.pr-sheets { display: flex; flex-direction: column; }
.pr-sheet { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.pr-sheet:last-child { border-bottom: 0; padding-bottom: 0; }
.pr-sheet:first-child { padding-top: 0; }

/* Wyniki */
.pr-score { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.pr-score b.num { font: 600 2.5rem/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.pr-verdict { font-size: .95rem; padding: 4px 13px; }
.pr-scale { display: flex; flex-direction: column; gap: 2px; padding: 0 12px; }
.pr-axis { position: relative; height: 18px; font: 500 .72rem/18px var(--f-mono); color: var(--ink-3); }
.pr-axis span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.pr-rev { border-bottom: 1px solid var(--line); min-width: 0; }
.pr-rev:last-child { border-bottom: 0; }
.pr-rev > summary { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto; gap: 4px 8px; align-items: start; padding: 10px 2px; cursor: pointer; list-style: none; }
.pr-rev > summary::-webkit-details-marker { display: none; }
.pr-rev > summary .num { color: var(--ink-3); }
.pr-rev > summary:hover .pr-res-q { color: var(--accent); }
.pr-rev[open] > summary .pr-res-q { display: block; font-size: 1.04rem; }
.pr-rev-chips { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
.pr-rev-body { padding: 4px 2px 18px; gap: 12px; }

@media (max-width: 620px) {
  .pr-form, .pr-filters { grid-template-columns: minmax(0, 1fr); }
  .pr-bar { gap: 8px; }
  .pr-timer { font-size: 1.25rem; padding: 6px 8px; }
  .pr-rev > summary { grid-template-columns: 2.2em minmax(0, 1fr); }
  .pr-rev-chips { grid-column: 2; justify-content: flex-start; }
  .pr-score b.num { font-size: 2.1rem; }
}

/* Fiszki: ekran startowy i sesja. Wszystkie klasy z prefiksem fz-. */

/* Szybki start: trzy duże przyciski z liczbą i jednym zdaniem opisu */
.fz-quick { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.fz-start { flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 3px; height: 100%; min-height: 78px; padding: 12px 14px; text-align: left; }
.fz-start small { font-size: .8rem; font-weight: 400; line-height: 1.35; color: var(--ink-2); }
.fz-start.primary small { color: inherit; }
/* Nieaktywny kafelek ma pozostać czytelny, bo jego opis wyjaśnia, dlaczego nie ma czego zacząć */
.fz-start[disabled] { opacity: 1; background: none; border-style: dashed; color: var(--ink-3); }

/* Lista tematów */
.fz-topic { display: flex; align-items: center; gap: 8px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.fz-topic:first-child { border-top: 0; padding-top: 0; }
.fz-topic:last-child { padding-bottom: 0; }
.fz-topic b { font-weight: 600; line-height: 1.3; }
.fz-code { flex: none; width: 2.6em; font-size: .8rem; font-weight: 600; color: var(--ink-3); }

/* Przeglądanie */
.fz-filters { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr) minmax(0, 240px); }
.fz-item { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.fz-item:first-child { border-top: 0; }
.fz-item > .grow { flex-basis: 260px; }
.fz-tags { margin-top: 4px; gap: 6px 8px; }
.fz-pre { white-space: pre-line; overflow-wrap: anywhere; }
.fz-more { padding-top: 12px; border-top: 1px solid var(--line); }
.fz-err { color: var(--bad); min-height: 1.4em; }

/* Karta w sesji */
.fz-flash { width: 100%; min-height: 250px; }
.fz-flash .front, .fz-flash .back { white-space: pre-line; overflow-wrap: anywhere; }
button.fz-flash:hover { border-color: var(--accent); }
.fz-flash.fz-open { cursor: default; border-top: 3px solid var(--accent); padding-top: 26px; }
.fz-flash.fz-open:focus { outline: none; }
.fz-rule { width: min(100%, 280px); height: 1px; margin: 0; border: 0; background: var(--line); }
.fz-center { justify-content: center; }

/* Oceny: etykieta, pod nią termin następnej powtórki, w rogu klawisz */
.fz-actions { display: flex; flex-direction: column; gap: 8px; min-height: 66px; }
.fz-actions > .btn.block { min-height: 58px; }
.fz-grades { display: grid; gap: 8px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.fz-grades.fz-two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.fz-grade { position: relative; flex-direction: column; gap: 1px; min-height: 58px; padding: 8px 6px; line-height: 1.25; }
.fz-grade small { font-size: .78rem; font-weight: 400; }
.fz-grade kbd { position: absolute; top: 4px; right: 7px; font: 500 .7rem/1 var(--f-mono); opacity: .75; }
.fz-grade.fz-easy { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.fz-grade:hover { border-color: currentColor; }

@media (max-width: 560px) {
  .fz-filters { grid-template-columns: minmax(0, 1fr); }
  .fz-grades { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fz-actions { min-height: 124px; }
  .fz-flash { min-height: 220px; }
}
@media (max-width: 820px), (hover: none) {
  .fz-grade kbd, .fz-keys { display: none; }
}

/* Widoki „Dziś”, „Plan” i „Jak się uczyć” oraz wspólna lista zadań (P.planUI.taskList). Wyłącznie tokeny kolorów z app.css. */

/* ---------- lista zadań ---------- */
.plan-tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.plan-task { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 16px; row-gap: 4px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
.plan-task:first-child { border-top: 0; padding-top: 2px; }
.plan-task:last-child { padding-bottom: 2px; }
.plan-task-main { grid-column: 1; display: flex; align-items: flex-start; gap: 12px; cursor: pointer; font-weight: 600; line-height: 1.4; }
.plan-task-main input { flex: none; width: 22px; height: 22px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.plan-task-info { grid-column: 1; display: flex; flex-direction: column; gap: 4px; padding-left: 34px; }
.plan-task-info p { max-width: 62ch; }
.plan-task-act { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
.plan-task-act .btn { white-space: nowrap; }
.plan-task.done .plan-task-title { color: var(--ink-2); font-weight: 500; }
.plan-task.done .plan-task-info p { display: none; }
@media (max-width: 600px) {
  .plan-task { grid-template-columns: minmax(0, 1fr); }
  .plan-task-act { grid-column: 1; grid-row: auto; padding-left: 34px; margin-top: 4px; }
}

/* ---------- plan: ustawienia ---------- */
.plan-set { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px; align-items: start; }
.plan-set-wide { grid-column: 1 / -1; }
.plan-set .seg { max-width: 100%; }
@media (max-width: 600px) { .plan-set { grid-template-columns: minmax(0, 1fr); } }

/* ---------- plan: lista tygodni ---------- */
.plan-list { display: flex; flex-direction: column; gap: 8px; }
.plan-block { display: flex; align-items: center; gap: 10px; margin: 14px 0 2px; font: 600 .8rem/1.3 var(--f-head); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.plan-block:first-child { margin-top: 0; }
.plan-block b { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 4px; background: var(--ink); color: var(--bg); font: 600 .85rem/1 var(--f-mono); letter-spacing: 0; }
.plan-week { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.plan-week.current { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
.plan-week > summary { list-style: none; position: relative; cursor: pointer; display: grid; grid-template-columns: 208px minmax(0, 1fr) 132px; column-gap: 16px; row-gap: 6px; align-items: start; padding: 13px 46px 13px 16px; border-radius: var(--r); }
.plan-week > summary::-webkit-details-marker { display: none; }
.plan-week > summary::after { content: ""; position: absolute; right: 19px; top: 18px; width: 9px; height: 9px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(45deg); transition: transform .15s; }
.plan-week[open] > summary::after { transform: rotate(225deg); top: 23px; }
.plan-week > summary:hover::after { border-color: var(--ink); }
.plan-week-id { font-size: .8rem; color: var(--ink-2); padding-top: 3px; white-space: nowrap; }
.plan-week.current .plan-week-id { color: var(--accent); font-weight: 600; }
.plan-week-title { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.plan-week-name { font: 600 1.04rem/1.25 var(--f-head); }
.plan-week-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.plan-week-prog { display: flex; align-items: center; gap: 8px; padding-top: 6px; color: var(--ink-2); }
.plan-week-prog .bar { flex: 1 1 auto; min-width: 40px; }
.plan-week-body { display: flex; flex-direction: column; gap: 22px; padding: 16px; border-top: 1px solid var(--line); }
.plan-part { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.plan-part > .label { margin-top: 8px; }
.plan-part + .plan-part { padding-top: 20px; border-top: 1px dashed var(--line); }
.plan-reads, .plan-norms { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.plan-read { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 6px 14px; }
.plan-read .check { flex: 1 1 280px; min-width: 0; }
.plan-read > .chip { margin-top: 2px; }
.plan-norm { display: flex; flex-direction: column; gap: 3px; }
@media (max-width: 760px) {
  .plan-week > summary { grid-template-columns: minmax(0, 1fr); padding-right: 42px; }
  .plan-week-id { padding-top: 0; }
  .plan-week-prog { padding-top: 2px; }
  .plan-read > .chip { margin-left: 30px; }
}

/* ---------- dziś ---------- */
.dzis-exam { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-align: right; }
.dzis-exam b { font-size: 1.3rem; line-height: 1.1; font-weight: 600; }
.dzis-note { flex-wrap: wrap; align-items: center; }
.dzis-note > svg { flex: none; align-self: flex-start; margin-top: 1px; color: var(--warn); }
.dzis-note > .stack { flex-basis: 260px; }
.dzis-intro { border-color: var(--accent); }
.dzis-steps { display: flex; flex-direction: column; gap: 8px; max-width: 70ch; padding-left: 1.4em; }
.dzis-steps li::marker { font-family: var(--f-mono); font-weight: 600; color: var(--accent); }
.dzis-intro-foot { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 20px; padding-top: 4px; }
.dzis-intro-foot .field { flex: 0 1 300px; }
.dzis-duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.dzis-tile { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); min-width: 0; }
.dzis-tile .stat b { font-size: 2rem; }
.dzis-tile .btn { margin-top: auto; }
.dzis-prog { display: flex; flex-direction: column; gap: 6px; }
.dzis-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 20px; }
.dzis-stats .stat { padding-left: 12px; border-left: 3px solid var(--line); }
.dzis-stats .stat b { font-size: 1.45rem; }
.dzis-stats .stat .bar { margin-top: 6px; height: 6px; }
@media (max-width: 600px) {
  .dzis-exam { flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; text-align: left; }
  .dzis-duo { grid-template-columns: minmax(0, 1fr); }
  .dzis-tile .btn { width: 100%; }
  .dzis-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dzis-stats .stat b { font-size: 1.3rem; }
  .dzis-intro-foot .field { flex-basis: 100%; }
  .dzis-intro-foot .btn.primary { flex: 1 1 auto; }
}

/* ---------- jak się uczyć ---------- */
.metoda { gap: 0; padding-block: 4px; }
.metoda-sec { display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: 12px; padding: 20px 0; border-top: 1px solid var(--line); }
.metoda-sec:first-child { border-top: 0; }
.metoda-n { font: 600 1.3rem/1.2 var(--f-mono); color: var(--accent); }
.metoda-body { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.metoda-body > p { max-width: 68ch; }
.metoda-body .table { max-width: 620px; }
.metoda-body .table th { white-space: normal; }
.metoda-body .table td.num { white-space: nowrap; }
.metoda-steps { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.metoda-step { min-width: 40px; padding: 5px 8px; text-align: center; font-weight: 600; font-size: .9rem; border: 1px solid var(--line); border-bottom: 3px solid var(--accent); border-radius: 4px; background: var(--bg); }
.metoda-arrow { color: var(--ink-3); }
@media (max-width: 600px) {
  .metoda-sec { grid-template-columns: 26px minmax(0, 1fr); column-gap: 8px; }
  .metoda-n { font-size: 1.1rem; padding-top: 2px; }
}

/* Nauka: lista lekcji (.nauka-*) i lekcja (.lekcja-*). Kolory wyłącznie z tokenów app.css. */
.nauka, .lekcja { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }
.nauka .chip svg, .lekcja .chip svg { width: 13px; height: 13px; flex: none; }
.lekcja [hidden] { display: none; }

/* --- lista lekcji --- */
.nauka-block { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.nauka-block h2 { display: flex; align-items: center; gap: 10px; }
.nauka-blk { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border: 1.5px solid currentColor; border-radius: 4px; font-size: .82rem; font-weight: 600; }
.nauka-item { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 6px 18px; padding: 14px 16px 14px 14px; background: var(--surface);
  border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: var(--r); color: var(--ink); text-decoration: none; }
.nauka-item:hover { border-color: var(--ink-3); }
.nauka-item.is-done { border-left-color: var(--ok); }
.nauka-item.is-current { border-left-color: var(--accent); box-shadow: var(--shadow); }
.nauka-week { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.nauka-n { font-size: 1.7rem; font-weight: 600; line-height: 1.05; }
.nauka-week .tiny { white-space: nowrap; }
.nauka-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.nauka-top h3 { flex: 1 1 260px; min-width: 0; }
.nauka-chips { gap: 6px; margin: 2px 0; }
@media (max-width: 600px) {
  .nauka-item { grid-template-columns: minmax(0, 1fr); padding: 12px 14px 12px 12px; }
  .nauka-week { flex-direction: row; align-items: baseline; gap: 8px; }
  .nauka-n { font-size: 1.05rem; }
}

/* --- lekcja: nagłówek i nawigacja po sekcjach --- */
.lekcja { counter-reset: lekcja-sec; }
.lekcja-head { gap: 8px; }
.lekcja-back { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; font-size: .9rem; font-weight: 600; text-decoration: none; }
.lekcja-back::before { content: ""; width: 7px; height: 7px; border-left: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); }
.lekcja-back:hover { text-decoration: underline; }
.lekcja-jump { position: sticky; top: 0; z-index: 5; margin: -6px 0; padding: 6px 0; background: var(--bg); }
.lekcja-jump > div { display: flex; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.lekcja-jump button { flex: 1 0 auto; min-height: 40px; padding: 6px 10px; border: 0; background: none; cursor: pointer; white-space: nowrap; font-size: .875rem; font-weight: 500; color: var(--ink-2); }
.lekcja-jump button + button { border-left: 1px solid var(--line); }
.lekcja-jump button:hover { background: var(--surface-2); color: var(--ink); }
.lekcja-jump button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.lekcja-jump button:focus-visible { outline-offset: -3px; }
.lekcja-warn { flex: none; color: var(--warn); line-height: 0; padding-top: 1px; }

/* --- sekcje --- */
.lekcja-sec { scroll-margin-top: 62px; }
.lekcja-sec > .card-head h2 { display: flex; align-items: center; gap: 10px; }
.lekcja-sec > .card-head h2::before { counter-increment: lekcja-sec; content: counter(lekcja-sec); flex: none; display: grid; place-items: center; width: 26px; height: 26px;
  border: 1.5px solid currentColor; border-radius: 4px; font: 600 .82rem/1 var(--f-mono); }
.lekcja-sec > .card-head h2:focus { outline: none; }
.lekcja-part { margin-top: 6px; }
.lekcja-list { list-style: none; margin: 0; padding: 0; }
.lekcja-item { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px 24px; padding: 14px 0; border-top: 1px solid var(--line); }
.lekcja-item:last-child { padding-bottom: 2px; }
.lekcja-what { flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.lekcja-checks { flex: none; display: flex; flex-wrap: wrap; gap: 8px 18px; }
.lekcja-checks .check { align-items: center; font-size: .92rem; min-height: 30px; }
.lekcja-checks .check input { margin: 0; }
.lekcja-pdf svg { width: 16px; height: 16px; }
.lekcja-chipwrap.chip { white-space: normal; border-radius: 10px; padding: 3px 10px; }
.lekcja-self { display: flex; flex-direction: column; gap: 4px; }

/* --- ściąga --- */
.lekcja-basis { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-width: 68ch; }
.lekcja-basis li { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.lekcja-basis li > .muted { flex: none; }
.lekcja-kv td:last-child { min-width: 9ch; }
.lekcja-traps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-width: 72ch; }
.lekcja-traps li { padding: 9px 12px; border-left: 3px solid var(--warn); border-radius: 0 var(--r-sm) var(--r-sm) 0; background: var(--warn-soft); font-size: .94rem; }

/* --- pytania z egzaminów --- */
.lekcja-qlist { border-top: 1px solid var(--line); }
.lekcja-q { border-bottom: 1px solid var(--line); }
.lekcja-q > summary { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 12px; padding: 11px 2px; cursor: pointer; list-style: none; font-size: .95rem; line-height: 1.45; }
.lekcja-q > summary::-webkit-details-marker { display: none; }
.lekcja-q > summary::before { content: ""; width: 7px; height: 7px; margin: .45em 0 0 1px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(-45deg); transition: transform .15s; }
.lekcja-q[open] > summary::before { transform: rotate(45deg); }
.lekcja-q > summary:hover { color: var(--accent); }
.lekcja-q[open] > summary { font-weight: 600; }
.lekcja-q:not([open]) .lekcja-qfull, .lekcja-q[open] .lekcja-qcut { display: none; }
.lekcja-qbody { display: flex; flex-direction: column; gap: 10px; padding: 2px 2px 16px 26px; }
.lekcja-ans { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.lekcja-ans li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); font-size: .95rem; }
.lekcja-ans li.is-key { border-color: var(--ok); background: var(--ok-soft); }
.lekcja-letter { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); color: var(--ink-2); font-size: .8rem; font-weight: 600; }
.lekcja-ans li.is-key .lekcja-letter { background: var(--ok); color: var(--surface); }
.lekcja-keytag { align-self: center; font: 600 .7rem/1.2 var(--f-head); letter-spacing: .08em; text-transform: uppercase; color: var(--ok); }

/* --- pytania otwarte --- */
.lekcja-oral { list-style: none; margin: 0; padding: 0; }
.lekcja-oral > li { display: flex; flex-direction: column; gap: 10px; padding: 14px 0; border-top: 1px solid var(--line); }
.lekcja-oral > li:last-child { padding-bottom: 2px; }
.lekcja-oq { font-weight: 500; max-width: 72ch; }

      body: h('div.st-meters', meter('Przerobione', seen, 0.8), meter('Utrwalone', mature, 0.6))

    const sf = P.srs.summary('f', P.cards.all().map(function (c) { return c.id; }));
    const matF = ratio(sf.mature, sf.total);
    out.push({
      title: 'Fiszki: brak zaległych i co najmniej 70% utrwalonych',
      met: sf.total > 0 && sf.due === 0 && matF >= 0.7,
      detail: sf.due ? 'Zaległe na dziś: ' + F.plural(sf.due, 'fiszka', 'fiszki', 'fiszek') + '.' : 'Nie ma zaległych fiszek.',

    const idx = P.plan.index();
    let done = 0, total = 0;
    P.plan.calWeeks().forEach(function (cw) {

    out.push({
      title: 'Zadania planu do bieżącego tygodnia wykonane w co najmniej 80%',

  }

  /* ---------- 2. wykres egzaminów próbnych ---------- */
  function examCard() {
    const ex = examList();
    const el = card('Egzaminy próbne', ex.length ? h('span.small.muted', F.plural(ex.length, 'próba', 'próby', 'prób')) : null,
      'Punkty z kolejnych prób na pełnych arkuszach: 40 pytań, +1 za dobrą odpowiedź, −1 za złą. Próg zaliczenia to 21 pkt, cel na próbach to ' + GOAL + ' pkt.');
    if (!ex.length) {
      el.appendChild(ui.empty('Nie masz jeszcze żadnej próby. Pierwsza pokaże punkt wyjścia, a kolejne — czy zbliżasz się do celu ' + GOAL + ' pkt.',
        ui.btn('Przejdź do egzaminu próbnego', function () { P.router.go('egzamin'); }, 'primary')));
      return { el: el, draw: null };
    }
    const lastEx = ex[ex.length - 1], three = ex.slice(-3);
    const best = Math.max.apply(null, ex.map(function (s) { return s.points; }));
    const passed = ex.filter(function (s) { return s.points >= 21; }).length;
    el.appendChild(h('div.grid.tight.st-stats',
      ui.stat(num(lastEx.points), 'ostatni wynik'), ui.stat(num(best), 'najlepszy wynik'),
      ui.stat(dec(U.sum(three, function (s) { return s.points; }) / three.length), three.length === 3 ? 'średnia z 3 ostatnich' : 'średnia z dotychczasowych'),
      ui.stat(passed + ' z ' + ex.length, 'prób z wynikiem od 21 pkt')));

    const wrap = h('div.st-chart'), readout = h('p.small.st-readout');
    const shown = ex.slice(-MAX_POINTS), off = ex.length - shown.length;
    let dots = [], width = 0;
    function describe(i) {
      const s = shown[i], p = s.points;
      const verdict = p >= GOAL ? 'Zaliczona, cel osiągnięty.' : p >= 21 ? 'Zaliczona, do celu brakuje ' + (GOAL - p) + ' pkt.' : 'Poniżej progu o ' + (21 - p) + ' pkt.';
      return 'Próba ' + (off + i + 1) + ' (' + fullDate(s.day) + ', ' + examWhat(s) + '): ' + pts(p) + ' — dobre ' + (s.ok || 0) + ', złe ' + (s.bad || 0) + ', bez odpowiedzi ' + (s.skip || 0) + '. ' + verdict;
    }
    function select(i) {
      P.clear(readout).appendChild(document.createTextNode(describe(i)));
      dots.forEach(function (d, k) { d.setAttribute('r', k === i ? 6.5 : 4.5); d.setAttribute('class', 'st-dot' + (k === i ? ' on' : '') + (k === shown.length - 1 ? ' last' : '')); });
    }
    function draw() {
      const W = Math.max(260, Math.round(wrap.clientWidth) || 640);
      if (W === width) return;
      width = W;
      const H = W < 480 ? 230 : 270, m = { l: 34, r: 62, t: 18, b: 28 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
      const slots = Math.max(shown.length, 8), pad = 14, step = (pw - 2 * pad) / (slots - 1);
      const x = function (i) { return Math.round((m.l + pad + i * step) * 10) / 10; };
      const y = function (v) { return Math.round((m.t + (40 - U.clamp(v, -10, 40)) / 50 * ph) * 10) / 10; };
      const root = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img',
        'aria-label': 'Wykres punktów z ' + F.plural(shown.length, 'próby', 'prób', 'prób') + ' egzaminu. Ostatni wynik: ' + pts(lastEx.points) + '. Próg 21 pkt, cel ' + GOAL + ' pkt.' });
      root.appendChild(svg('rect', { class: 'st-zone', x: m.l, y: y(40), width: pw, height: y(21) - y(40) }));
      [-10, 0, 10, 20, 30, 40].forEach(function (v) {
        root.appendChild(svg('line', { class: 'st-gridline' + (v === 0 ? ' zero' : ''), x1: m.l, x2: m.l + pw, y1: y(v), y2: y(v) }));
        root.appendChild(svg('text', { class: 'st-tick', x: m.l - 8, y: y(v) + 4, 'text-anchor': 'end' }, num(v)));
      });
      root.appendChild(svg('line', { class: 'st-goal', x1: m.l, x2: m.l + pw, y1: y(GOAL), y2: y(GOAL) }));
      root.appendChild(svg('line', { class: 'st-pass', x1: m.l, x2: m.l + pw, y1: y(21), y2: y(21) }));
      root.appendChild(svg('text', { class: 'st-tick strong', x: m.l + pw + 8, y: y(GOAL) + 1 }, 'cel ' + GOAL));
      root.appendChild(svg('text', { class: 'st-tick strong', x: m.l + pw + 8, y: y(21) + 7 }, 'próg 21'));
      if (shown.length > 1) root.appendChild(svg('polyline', { class: 'st-line', points: shown.map(function (s, i) { return x(i) + ',' + y(s.points); }).join(' ') }));
      const every = step >= 22 ? 1 : step >= 11 ? 2 : 5;
      dots = shown.map(function (s, i) {
        const n = off + i + 1;
        if (i === 0 || n % every === 0) root.appendChild(svg('text', { class: 'st-tick', x: x(i), y: H - 8, 'text-anchor': 'middle' }, n));
        return root.appendChild(svg('circle', { class: 'st-dot', cx: x(i), cy: y(s.points), r: 4.5 }));
      });
      const li = shown.length - 1, ly = y(lastEx.points);
      root.appendChild(svg('text', { class: 'st-val', x: x(li), y: ly - 13 < m.t ? ly + 22 : ly - 13, 'text-anchor': 'middle' }, num(lastEx.points)));
      shown.forEach(function (s, i) {
        const hit = svg('circle', { class: 'st-hit', cx: x(i), cy: y(s.points), r: U.clamp(step / 2, 10, 18) }, svg('title', null, describe(i)));
        hit.addEventListener('mouseenter', function () { select(i); });
        hit.addEventListener('click', function () { select(i); });
        root.appendChild(hit);
      });
      root.addEventListener('mouseleave', function () { select(li); });
      root.appendChild(svg('text', { class: 'st-tick', x: m.l + pw + 8, y: H - 8 }, 'próba'));
      P.clear(wrap).appendChild(root);
      select(li);
    }
    el.appendChild(wrap);
    el.appendChild(readout);
    el.appendChild(h('details.fold', h('summary', 'Wyniki w tabeli'),
      ui.table(['Nr', 'Data', 'Arkusz', 'Dobre', 'Złe', 'Bez odp.', 'Punkty', 'Wynik'], ex.map(function (s, i) {
        return [i + 1, fullDate(s.day), s.sheet || '–', s.ok || 0, s.bad || 0, s.skip || 0, num(s.points), ui.chip(s.points >= 21 ? 'zaliczony' : 'poniżej progu', s.points >= 21 ? 'ok' : 'bad')];
      }).reverse(), [0, 3, 4, 5, 6])));
    return { el: el, draw: draw, wrap: wrap };
  }

  /* ---------- 3. tematy ---------- */
  function topicRows() {
    const state = P.store.get('srs').q, by = {};
    P.q.pool({}).forEach(function (q) {
      const r = by[q.topic] || (by[q.topic] = { n: 0, seen: 0, mature: 0, ok: 0, bad: 0 }), s = state[q.id];
      r.n++;
      if (!s) return;
      r.ok += s[4] || 0; r.bad += s[5] || 0;
      if (s[0] > 0) { r.seen++; if (s[0] >= 4) r.mature++; }
    });
    const rows = [];
    P.data.topics.forEach(function (t) { const r = by[t.code]; if (r && r.n) { r.t = t; r.ans = r.ok + r.bad; r.acc = r.ans ? r.ok / r.ans : null; rows.push(r); } });
    const rated = rows.filter(function (r) { return r.ans >= MIN_RATED; }).sort(function (a, b) { return a.acc - b.acc || a.seen / a.n - b.seen / b.n; });
    return rated.concat(rows.filter(function (r) { return r.ans < MIN_RATED; }));
  }
  function cell(cls, label, content) { return h('td' + (cls ? '.' + cls : ''), { role: 'cell', dataset: label ? { label: label } : null }, content); }

    const head = h('tr', { role: 'row' }, ['Temat', 'Pytań', 'Przerobione', 'Trafność', 'Utrwalone', 'Postęp', ''].map(function (x, i) {
      return h('th' + (i >= 1 && i <= 4 ? '.num' : ''), { role: 'columnheader' }, x || h('span.st-sr', 'Ćwiczenie'));
    }));
    const body = h('tbody', { role: 'rowgroup' }, rows.map(function (r) {
      const name = r.t.short || r.t.name, seen = r.seen / r.n, mature = r.mature / r.n;
      const bar = h('div.st-seg', { role: 'img', 'aria-label': 'Utrwalone ' + F.pct(mature) + ', w nauce ' + F.pct(seen - mature) + ', nowe ' + F.pct(1 - seen) },

        cell('num', 'Pytań', r.n),
        cell('num', 'Przerob.', F.pct(seen)),
        cell('num', 'Trafność', [r.acc == null ? '–' : F.pct(r.acc), r.ans ? h('span.tiny.muted.st-sub', r.ok + ' z ' + r.ans) : null]),
        cell('num', 'Utrwal.', F.pct(mature)),
        cell('st-c-bar', '', bar),
        cell('st-c-act', '', h('button.btn.sm', { type: 'button', 'aria-label': 'Ćwicz temat: ' + name,

    }));

  /* ---------- 4. kalibracja ---------- */
  function calibCard() {
    const c = P.store.get('log').calib || {}, groups = [['Gdy zaznaczasz „jestem pewny”', c.sure || [0, 0]], ['Gdy zaznaczasz „zgaduję”', c.unsure || [0, 0]]];
    const el = card('Kalibracja pewności', null, 'W nauce zaznaczasz przed odpowiedzią „jestem pewny” albo „zgaduję”. Tu widać, ile ta ocena jest warta przy punktach ujemnych.');
    groups.forEach(function (g) {
      const ok = g[1][0] || 0, n = g[1][1] || 0, acc = n ? ok / n : 0;
      const tick = h('i.st-target', { 'aria-hidden': 'true' }); tick.style.left = '50%';
      el.appendChild(h('div.st-meter',
        h('div.row.between', h('span', g[0]), h('b.num', n ? F.pct(acc) : '–')),
        h('div.st-meter-track', ui.bar(acc, n ? (acc > 0.5 ? 'ok' : 'warn') : ''), tick),
        h('span.tiny.muted', n ? 'Dobre odpowiedzi: ' + ok + ' z ' + n + ' · średnio ' + (acc * 2 - 1 > 0 ? '+' : '') + dec(acc * 2 - 1) + ' pkt za odpowiedź'
          : 'Brak odpowiedzi z tym oznaczeniem.')));
    });

    else if (a === 'nie') { kind = 'warn'; text = 'Nawet przy odpowiedziach oznaczonych jako pewne trafność nie przekracza 50%, więc na egzaminie pomijaj wszystko, czego nie potrafisz uzasadnić przepisem.'; }
    else if (a === 'tak' && b === 'tak') text = 'Na egzaminie odpowiadaj także wtedy, gdy zgadujesz: w obu grupach trafność przekracza 50%, więc odpowiedź średnio dodaje punkty.';

    else if (a === 'tak') text = 'Na egzaminie odpowiadaj, gdy masz pewność; o zgadywaniu nic jeszcze nie wiadomo, bo w tej grupie jest mniej niż ' + MIN_CALIB + ' odpowiedzi.';
    else if (b === 'tak') text = 'Przy zgadywaniu trafność przekracza 50%, więc na egzaminie takie odpowiedzi się opłacają; w grupie odpowiedzi pewnych jest jeszcze za mało danych.';
    else { kind = 'warn'; text = 'Przy zgadywaniu trafność nie przekracza 50%, więc na egzaminie takie pytania pomijaj; w grupie odpowiedzi pewnych jest jeszcze za mało danych.'; }
    el.appendChild(ui.banner(kind, 'Wniosek', text));
    el.appendChild(h('p.tiny.muted', 'Kreska na pasku to 50%. Przy punktacji +1 / −1 odpowiedź opłaca się dopiero powyżej tej granicy.'));
    return el;
  }

  /* ---------- 5. aktywność ---------- */
  function dayValue(r) { return r ? Math.max(r.m || 0, Math.round(((r.q || 0) + (r.f || 0)) * 0.6)) : 0; }
  function level(v) { return v <= 0 ? 0 : v < 15 ? 1 : v < 30 ? 2 : v < 60 ? 3 : 4; }
  function dayText(iso, r, future) {
    const parts = [];
    if (r && r.m) parts.push(F.mins(r.m));
    if (r && r.q) parts.push(qWord(r.q));
    if (r && r.f) parts.push(F.plural(r.f, 'fiszka', 'fiszki', 'fiszek'));
    return F.dow(iso) + ' ' + fullDate(iso) + (future ? '' : ': ' + (parts.length ? parts.join(', ') : 'bez nauki'));
  }
  function activityCard() {
    const days = P.store.get('log').days || {}, today = U.today(), mon = U.monday(today), first = U.addDays(mon, -77);
    const el = card('Aktywność', null, 'Ostatnie 12 tygodni. Im ciemniejsze pole, tym więcej nauki danego dnia.');
    const grid = h('div.st-heat'), readout = h('p.small.muted.st-readout', dayText(today, days[today]));
    let active = 0, prevMonth = -1;
    DOW.forEach(function (d, i) { grid.appendChild(h('span.st-heat-lab', { 'aria-hidden': 'true', style: { gridColumn: '1', gridRow: String(i + 2) } }, d)); });
    for (let w = 0; w < 12; w++) {
      const month = U.parse(U.addDays(first, w * 7)).getMonth();
      if (month !== prevMonth) grid.appendChild(h('span.st-heat-lab.top', { 'aria-hidden': 'true', style: { gridColumn: String(w + 2), gridRow: '1' } }, MON[month]));
      prevMonth = month;
      for (let d = 0; d < 7; d++) {
        const iso = U.addDays(first, w * 7 + d), future = iso > today, r = days[iso], lv = future ? 0 : level(dayValue(r));
        if (lv) active++;
        grid.appendChild(h('span.st-day.l' + lv + (future ? '.future' : '') + (iso === today ? '.today' : ''),
          { title: dayText(iso, r, future), dataset: { text: dayText(iso, r, future) }, style: { gridColumn: String(w + 2), gridRow: String(d + 2) } }));
      }
    }
    grid.setAttribute('role', 'img');
    grid.setAttribute('aria-label', 'Siatka aktywności z 12 tygodni: ' + F.plural(active, 'dzień', 'dni', 'dni') + ' z nauką.');

    const total = U.sum(Object.keys(days), function (k) { return days[k].m || 0; });
    const week = P.log.minutes(mon, U.addDays(mon, 6)), goal = Math.round((P.settings().hours || 0) * 60), streak = P.log.streak();
    el.appendChild(h('hr.divider'));
    el.appendChild(h('div.grid.tight.st-stats',
      ui.stat(String(streak), streak === 1 ? 'dzień nauki z rzędu' : 'dni nauki z rzędu'),
      ui.stat(F.mins(total), 'łączny czas nauki'),
      h('div.stat', h('b', F.mins(week)), h('span', 'w tym tygodniu' + (goal ? ', cel ' + F.mins(goal) : '')), goal ? ui.bar(week / goal, week >= goal ? 'ok' : '') : null)));
    return el;
  }

  /* ---------- 6. ostatnie sesje ---------- */
  function sessionResult(s) {

    }
    if (s.type === 'fiszki') return s.n ? F.plural(s.n, 'fiszka', 'fiszki', 'fiszek') : '–';
    if (s.n) { const ans = (s.ok || 0) + (s.bad || 0); return h('span.num', (s.ok || 0) + ' z ' + s.n + (ans ? ' (' + F.pct((s.ok || 0) / ans) + ')' : '')); }

  function sessionsCard() {

  }
  function applyLegacy(plan) {
    plan.changes.forEach(function (c) { P.q.setKey(c.q, c.to, 'import ze starego quizu'); });
    if (plan.add.length) {
      const notes = P.store.get('notes');
      notes.customQ = (notes.customQ || []).concat(plan.add);
      P.store.save('notes');
    }
  }
  function legacyDialog(plan, done) {
    const todo = plan.changes.length + plan.add.length, lines = [];
    function list(arr) { return arr.slice(0, 12).join(', ') + (arr.length > 12 ? ' i ' + (arr.length - 12) + ' dalszych' : ''); }
    lines.push('Poprawki, które zmienią klucz: ' + plan.changes.length + '.');
    if (plan.same) lines.push('Poprawki zgodne z obecnym kluczem aplikacji (bez zmian): ' + plan.same + '.');
    if (plan.unknown.length) lines.push('Numery, których nie ma w tej bazie pytań (pominięte): ' + list(plan.unknown) + '.');
    if (plan.invalid.length) lines.push('Poprawki z odpowiedzią inną niż a, b lub c (pominięte): ' + list(plan.invalid) + '.');
    lines.push('Własne pytania do dodania: ' + plan.add.length + '.');
    if (plan.dup) lines.push('Własne pytania, które już są w aplikacji (pominięte): ' + plan.dup + '.');
    if (plan.broken) lines.push('Własne pytania niepełne, bez treści, trzech odpowiedzi albo klucza (pominięte): ' + plan.broken + '.');
    const table = plan.changes.length ? h('div.us-scroll', ui.table(['Pytanie', 'Treść', 'Teraz', 'Po imporcie'], plan.changes.map(function (c) {
      const text = norm(c.q.q);
      return [h('span.num', 'nr ' + c.q.id), h('span.small', text.length > 90 ? text.slice(0, 88) + '…' : text), h('span.num', c.from || 'brak'), h('b.num', c.to)];
    }))) : null;
    ui.modal({
      title: todo ? 'Importować dane ze starego quizu?' : 'Nie ma nic do zaimportowania',
      body: h('div.stack', h('ul.small', lines.map(function (x) { return h('li', x); })), table,
        todo ? h('p.small.muted', 'Poprawki zapiszą się jako Twoje zmiany klucza i będą miały pierwszeństwo przed kluczem aplikacji. Własne pytania dostaną niską pewność klucza, bo nikt ich nie weryfikował.') : null),
      actions: todo ? [{ label: 'Anuluj' }, { label: 'Importuj', cls: 'primary', onClick: function () {
        applyLegacy(plan);
        ui.toast('Zaimportowano: ' + F.plural(plan.changes.length, 'poprawka', 'poprawki', 'poprawek') + ', ' + F.plural(plan.add.length, 'pytanie', 'pytania', 'pytań'));
        done();
      } }] : [{ label: 'Zamknij' }]
    });
  }

  /* Wspólne wejścia: ukryte pole pliku przy przycisku oraz okno do wklejenia tekstu (gdy plik był zapisany przez skopiowanie). */
  function fileButton(label, cls, failTitle, onText) {
    const inp = h('input', { type: 'file', accept: '.json,application/json', hidden: true, tabIndex: -1, 'aria-hidden': 'true' });
    inp.addEventListener('change', function () {
      const f = inp.files && inp.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = function () { inp.value = ''; try { onText(String(r.result || '')); } catch (e) { errorDialog(failTitle, e && e.message); } };
      r.onerror = function () { inp.value = ''; errorDialog(failTitle, 'Nie udało się odczytać pliku.'); };
      r.readAsText(f);
    });
    return [ui.btn(label, function () { inp.click(); }, cls), inp];
  }
  function pasteDialog(title, hint, onText) {
    const ta = h('textarea.input', { rows: 8, 'aria-label': 'Zawartość pliku', spellcheck: false }), err = h('p.small.us-error', { role: 'alert' });
    ui.modal({ title: title, body: h('div.stack', h('p.small.muted', hint), ta, err),
      actions: [{ label: 'Anuluj' }, { label: 'Dalej', cls: 'primary', onClick: function (close) {
        let next;
        try { next = onText(ta.value); } catch (e) { err.textContent = (e && e.message) || 'Nie udało się odczytać tekstu.'; return false; }
        close(); next();
        return false;
      } }] });
  }

  function backupCard(refreshAbout) {
    const el = section('Postęp i kopia zapasowa'), status = h('div.stack');
    statusBlock(status);
    unsubscribe = P.store.onChange(function (what) { if (what !== 'data' && status.isConnected) statusBlock(status); });
    el.appendChild(status);

    el.appendChild(h('hr.divider'));
    el.appendChild(h('div.stack.tight', h('h3', 'Kopia zapasowa'), h('p.small.muted', 'Jeden plik z całym postępem: powtórkami, planem, dziennikiem, notatkami i ustawieniami. Służy też do przeniesienia postępu na inne urządzenie.')));
    el.appendChild(h('div.row',
      ui.btn('Zapisz kopię zapasową', function () { ui.saveFile('ppoz-postep-' + U.today() + '.json', JSON.stringify(P.store.exportAll()), 'application/json'); }, 'primary'),
      fileButton('Wczytaj kopię', '', 'Nie udało się wczytać kopii', openBackup),
      ui.btn('Wklej tekst kopii', function () {
        pasteDialog('Wklej tekst kopii zapasowej', 'Jeśli kopia była zapisana przez skopiowanie tekstu, wklej go tutaj w całości.', function (text) { const obj = parseJson(text); checkBackup(obj); return function () { backupDialog(obj); }; });
      }, 'ghost')));

    el.appendChild(h('hr.divider'));
    el.appendChild(h('div.stack.tight', h('h3', 'Stary quiz'), h('p.small.muted', 'Jeśli w dawnym „Quizie egzaminacyjnym” są Twoje poprawki klucza albo własne pytania, wyeksportuj je tam do pliku i wczytaj tutaj. Przed zapisem zobaczysz, co się zmieni.')));
    el.appendChild(h('div.row', fileButton('Importuj poprawki ze starego quizu', '', 'Nie udało się zaimportować', function (text) { legacyDialog(legacyPlan(parseJson(text)), refreshAbout); })));

    el.appendChild(h('hr.divider'));
    el.appendChild(h('div.stack.tight', h('h3', 'Usuwanie postępu'), h('p.small.muted', 'Usuwa powtórki, odhaczone zadania, dziennik i notatki. Ustawienia zostają.')));
    el.appendChild(h('div.row', ui.btn('Usuń cały postęp', function () {
      const cloud = P.store.status().mode === 'cloud';
      ui.confirm('Usunąć cały postęp?',
        'Znikną wyniki powtórek pytań i fiszek, odhaczone zadania planu, dziennik nauki z sesjami oraz Twoje poprawki klucza, notatki i własne pytania. Ustawienia zostaną. Tej operacji nie da się cofnąć, więc jeśli postęp może się jeszcze przydać, najpierw zapisz kopię zapasową.' +
        (cloud ? ' Jeśli korzystasz z aplikacji także na innym urządzeniu, usuń postęp również tam — inaczej wróci przy synchronizacji.' : ''),
        'Usuń cały postęp', true).then(function (yes) { if (yes) { P.store.resetAll(); ui.toast('Postęp został usunięty'); } });
    }, 'bad')));
    return el;
  }

  /* ---------- o danych ---------- */
  function shares(map, order, labels) {
    const keys = Object.keys(map || {}).sort(function (a, b) { const i = order.indexOf(a), j = order.indexOf(b); return (i < 0 ? 99 : i) - (j < 0 ? 99 : j) || map[b] - map[a]; });
    const total = U.sum(keys, function (k) { return map[k] || 0; });
    if (!total) return h('p.small.muted', 'Brak danych.');
    return h('ul.us-shares', keys.map(function (k) {
      const n = map[k] || 0;
      return h('li', h('span.us-share-name', (labels && labels[k]) || k.charAt(0).toUpperCase() + k.slice(1)), h('span.num.us-share-n', n + ' · ' + F.pct(n / total)), ui.bar(n / total));
    }));
  }
  function aboutCard() {
    const m = P.data.meta || {}, counts = m.counts || {}, key = m.key || {}, exam = m.exam || {}, notes = P.store.get('notes');
    const el = section('O danych');
    const over = Object.keys(notes.over || {}).filter(function (k) { return notes.over[k] && notes.over[k].key; }).length, own = (notes.customQ || []).length;
    el.appendChild(h('div.grid.tight',
      ui.stat(String(counts.questions != null ? counts.questions : P.data.questions.length), 'pytań z arkuszy KG PSP'),
      ui.stat(String(counts.flashcards != null ? counts.flashcards : P.data.flashcards.length), 'fiszek'),
      ui.stat(String(counts.lessons != null ? counts.lessons : P.data.lessons.length), 'lekcji')));
    el.appendChild(h('div.row',
      m.legalDate ? ui.ref('Stan prawny na dzień ' + F.date(m.legalDate)) : null,
      m.built ? ui.ref('Dane zbudowano ' + F.date(m.built)) : null,
      exam.questions ? ui.ref('Egzamin: ' + exam.questions + ' pytań, ' + exam.minutes + ' min, próg ' + exam.pass_ + ' pkt') : null));

    const verif = key.verif || {}, total = U.sum(Object.keys(verif), function (k) { return verif[k] || 0; });
    const old = verif['stary-klucz'] || 0, none = verif.brak || 0;
    if (total && (old || none)) {
      el.appendChild(ui.banner('warn', 'Klucz odpowiedzi nie jest w pełni zweryfikowany',
        [old ? old + ' z ' + total + ' odpowiedzi pochodzi z wcześniejszego klucza i nie przeszło ponownej weryfikacji.' : '', none ? 'Bez klucza: ' + F.plural(none, 'pytanie', 'pytania', 'pytań') + '.' : '',
          'Przy każdym pytaniu aplikacja pokazuje pewność klucza.'].filter(Boolean).join(' ')));
    }
    el.appendChild(h('div.grid.us-grid',
      h('div.stack.tight', h('h3', 'Pewność klucza odpowiedzi'), shares(key.conf, ['wysoka', 'średnia', 'niska'])),
      h('div.stack.tight', h('h3', 'Sposób weryfikacji klucza'), shares(key.verif, ['zgodne'], VERIF))));
    if (over || own) el.appendChild(h('p.small.muted', 'Twoje zmiany: ' + F.plural(over, 'poprawka klucza', 'poprawki klucza', 'poprawek klucza') + ', ' + F.plural(own, 'własne pytanie', 'własne pytania', 'własnych pytań') + '.'));
    el.appendChild(ui.banner('', 'Zastrzeżenie', 'Pytania pochodzą z publikacji KG PSP. Klucz odpowiedzi i wyjaśnienia opracowano niezależnie i mogą zawierać błędy. Rozstrzygają aktualne teksty przepisów i norm.'));
    return el;
  }

  /* ---------- widok ---------- */
  function render(root) {
    let about = aboutCard();
    function refreshAbout() { const next = aboutCard(); if (about.parentNode) about.parentNode.replaceChild(next, about); about = next; }
    root.appendChild(h('div.view-head', h('div.stack.tight', h('h1', 'Ustawienia'), h('p', 'Zmiany zapisują się od razu.'))));
    root.appendChild(planCard());
    root.appendChild(reviewCard());
    root.appendChild(lookCard());
    root.appendChild(backupCard(refreshAbout));
    root.appendChild(about);
  }
  function leave() { if (unsubscribe) { unsubscribe(); unsubscribe = null; } }

  P.views.ustawienia = { title: 'Ustawienia', render: render, leave: leave };
})();

/* Powłoka: nawigacja, trasy (#nazwa lub #nazwa-parametr), uruchomienie aplikacji. Ładowana jako ostatnia. */
(function () {
  'use strict';
  var P = window.PPOZ, h = P.h, ui = P.ui;
  var NAV = [
    { id: 'dzis', label: 'Dziś' }, { id: 'plan', label: 'Plan' }, { id: 'nauka', label: 'Nauka' }, { id: 'pytania', label: 'Pytania' },
    { id: 'fiszki', label: 'Fiszki' }, { id: 'egzamin', label: 'Egzamin próbny' }, { sep: true },
    { id: 'zrodla', label: 'Przepisy i normy' }, { id: 'statystyki', label: 'Statystyki' }, { id: 'metoda', label: 'Jak się uczyć' }, { id: 'ustawienia', label: 'Ustawienia' }
  ];
  var TABS = ['dzis', 'plan', 'nauka', 'pytania'];
  var ALIAS = { lekcja: 'nauka' };
  var cur = { name: '', param: '', view: null }, root, rail, tabbar, payload = null;

  function parse() { var s = decodeURIComponent((location.hash || '').replace(/^#/, '')), i = s.indexOf('-'); return i < 0 ? { name: s || 'dzis', param: '' } : { name: s.slice(0, i), param: s.slice(i + 1) }; }
  function navName(name) { return ALIAS[name] || name; }
  function badge(id) { if (id !== 'dzis' || !P.data.questions) return 0; var t = P.today(); return t.capQ + t.capF; }

  function buildNav() {
    P.clear(rail); P.clear(tabbar);
    rail.appendChild(h('div.brand', h('b', 'Egzamin rzeczoznawcy ppoż.'), h('span', weekLine())));
    NAV.forEach(function (n) {
      if (n.sep) { rail.appendChild(h('div.nav-sep')); return; }
      var b = badge(n.id);
      rail.appendChild(h('a.nav-item', { href: '#' + n.id, 'aria-current': navName(cur.name) === n.id ? 'page' : null }, P.icon(n.id), h('span', n.label), b ? h('span.count', b) : null));
    });
    rail.appendChild(h('div.rail-foot', syncLine()));
    TABS.forEach(function (id) {
      var n = NAV.filter(function (x) { return x.id === id; })[0], b = badge(id);
      tabbar.appendChild(h('a.nav-item', { href: '#' + id, 'aria-current': navName(cur.name) === id ? 'page' : null }, P.icon(id), h('span', n.label), b ? h('span.count', b) : null));
    });
    var more = TABS.indexOf(navName(cur.name)) < 0;
    tabbar.appendChild(h('button.nav-item', { type: 'button', 'aria-current': more ? 'page' : null, onclick: moreMenu }, P.icon('wiecej'), h('span', 'Więcej')));
  }
  function weekLine() {
    var ph = P.plan.phase(), w = P.plan.calWeeks();
    if (ph === 'przed') return 'Start planu: ' + P.fmt.date(P.plan.start());
    if (ph === 'po') return 'Plan zakończony';
    return 'Tydzień ' + (P.plan.index() + 1) + ' z ' + w.length;
  }
  function syncLine() {
    var s = P.store.status();
    if (s.mode === 'cloud') return s.pending ? 'Zapisywanie postępu…' : 'Postęp zapisany na koncie Claude';
    return s.local ? 'Postęp zapisany tylko w tej przeglądarce' : 'Uwaga: ta przeglądarka nie zapisuje postępu';
  }
  function moreMenu() {
    var close = ui.modal({ title: 'Więcej', body: h('div.stack.tight', NAV.filter(function (n) { return !n.sep && TABS.indexOf(n.id) < 0; }).map(function (n) {
      return h('a.nav-item', { href: '#' + n.id, onclick: function () { close(); } }, P.icon(n.id), h('span', n.label));
    })), actions: [{ label: 'Zamknij' }] });
  }

  function show() {
    var r = parse(), view = P.views[r.name];
    if (!view) { r = { name: 'dzis', param: '' }; view = P.views.dzis; }
    if (cur.view && cur.view.leave) { try { cur.view.leave(); } catch (e) { console.error(e); } }
    cur = { name: r.name, param: r.param, view: view };
    P.clear(root); window.scrollTo(0, 0);
    var data = payload; payload = null;
    try { if (view) view.render(root, r.param, data); else root.appendChild(ui.empty('Ten widok jest w przygotowaniu.')); }
    catch (e) { console.error(e); P.clear(root); root.appendChild(ui.banner('bad', 'Nie udało się wyświetlić widoku', String(e && e.message || e))); }
    document.title = (view && view.title ? view.title + ' · ' : '') + 'Egzamin rzeczoznawcy ppoż.';
    buildNav();
  }

  P.router = {
    /* go('pytania', 'sesja', {…}) — trzeci argument trafia do render(root, param, payload) i nie jest zapisywany w adresie. */
    go: function (name, param, data) { payload = data || null; var hash = '#' + name + (param ? '-' + param : ''); if (location.hash === hash) show(); else location.hash = hash; },
    current: function () { return { name: cur.name, param: cur.param }; },
    refresh: function () { if (cur.view && cur.view.busy && cur.view.busy()) { buildNav(); return; } show(); },
    updateNav: function () { buildNav(); }
  };
  P.applyTheme = function () { var t = P.settings().theme, el = document.documentElement; if (t === 'light' || t === 'dark') el.setAttribute('data-theme', t); else if (!window.claude) el.removeAttribute('data-theme'); };

  function boot() {
    root = document.getElementById('view'); rail = document.getElementById('rail'); tabbar = document.getElementById('tabbar');
    root.appendChild(h('p.muted', 'Wczytywanie danych…'));
    P.data.ready.then(function () {
      P.applyTheme(); show();
      window.addEventListener('hashchange', show);
      P.store.onChange(function (what) { if (what === 'data') P.router.refresh(); else if (what === 'sync') buildNav(); });
    }, function (e) { P.clear(root); root.appendChild(ui.banner('bad', 'Nie udało się wczytać danych aplikacji', String(e && e.message || e))); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
